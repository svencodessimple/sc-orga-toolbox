name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run quality checks
        run: make check